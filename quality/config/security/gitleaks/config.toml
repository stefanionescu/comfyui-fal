title = "fal node secret rules"

[extend]
useDefault = true

[[rules]]
id = "fal-api-key"
description = "fal API key"
regex = '''\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}:[0-9a-fA-F]{32}\b'''

[[rules]]
id = "fal-api-key-assignment"
description = "fal API key assigned to FAL_KEY"
regex = '''\bFAL_KEY["'\]]{0,2}[ \t]*[:=][ \t]*["']?([A-Za-z0-9+/=_.:-]{20,})'''
secretGroup = 1
keywords = ["fal_key"]
