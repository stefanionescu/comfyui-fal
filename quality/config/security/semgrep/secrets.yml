rules:
    - id: fal-secrets-hf-token-literal
      message: Do not commit HuggingFace token literals.
      severity: ERROR
      languages:
          - generic
      pattern-regex: 'hf_[A-Za-z0-9]{20,}'
    - id: fal-api-key-literal
      message: Keep fal API keys out of the repository. Use FAL_KEY or fal Settings.
      severity: ERROR
      languages:
          - generic
      pattern-regex: '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}:[0-9a-fA-F]{32}\b'
    - id: fal-api-key-assignment-literal
      message: Keep fal API keys out of the repository. Use FAL_KEY or fal Settings.
      severity: ERROR
      languages:
          - generic
      pattern-regex: '\bFAL_KEY["''\]]{0,2}[ \t]*[:=][ \t]*["'']?[A-Za-z0-9+/=_.:-]{20,}'
