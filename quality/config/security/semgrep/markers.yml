rules:
    - id: fal-python-no-obsolete-markers
      message: Do not use obsolete marker wording in Python source.
      severity: ERROR
      languages:
          - generic
      paths:
          include:
              - /src/**/*.py
              - /scripts/**/*.py
              - /__init__.py
              - /quality/**/*.py
      pattern-regex: '(?i)\b(?:legacy|workaround|backward(?:\s|-)?compat(?:ible|ibility)|compatibility)\b'
    # fal marks a model it is retiring "deprecated" in its listing, and the model records keep that word. This rule
    # skips the one file that holds it.
    - id: fal-python-no-deprecated-marker
      message: Do not use obsolete marker wording in Python source.
      severity: ERROR
      languages:
          - generic
      paths:
          include:
              - /src/**/*.py
              - /scripts/**/*.py
              - /__init__.py
              - /quality/**/*.py
          exclude:
              - /src/types/models.py
      pattern-regex: '(?i)\bdeprecated\b'
