[project]
name = "fal-ai"
version = "0.1.0"
description = "Use any fal model in ComfyUI with your own API key: images, video, audio, text, and 3D models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Stefan Ionescu" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "aiohttp>=3.12,<4",
    "import-linter==2.15",
]

[tool.deptry]
# yarl comes with ComfyUI's aiohttp. Output downloads pass a yarl URL so aiohttp sends a signed address unchanged.
per_rule_ignores.DEP003 = ["yarl"]
# ComfyUI supplies aiohttp; the dev group installs it only for the type checker.
per_rule_ignores.DEP004 = ["aiohttp"]
known_first_party = ["scripts", "src"]

[tool.comfy]
DisplayName = "fal"
Icon = "https://raw.githubusercontent.com/stefanionescu/comfyui-fal/main/docs/images/brand/logo.png"
requires-comfyui = ">=0.37.2"

[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the ComfyUI boundary and the nodes import ComfyUI's modules"
type = "forbidden"
allow_indirect_imports = true
# The node classes and the comfy package are the host boundary: ComfyUI calls them and they speak its types.
source_modules = [
    "src.config",
    "src.fal",
    "src.settings",
    "src.storage",
    "src.state",
]
forbidden_modules = [
    "comfy",
    "comfy_api",
    "comfy_api_nodes",
    "comfy_execution",
    "comfy_extras",
    "folder_paths",
    "node_helpers",
    "nodes",
    "server",
]
