ily="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" letter-spacing="0" fill="#A19FA4" text-anchor="start">Collects a stopped request</text><rect x="517.75" y="456.75" width="8.5" height="8.5" rx="2" fill="#19171C" stroke="#A284FF" stroke-width="1.5"/><text x="538" y="466" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" letter-spacing="-0.2" fill="#F5F3F8" text-anchor="start">Request Options</text><text x="538" y="483" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" letter-spacing="0" fill="#A19FA4" text-anchor="start">Queue, retries, file lifetime</text><rect x="749.75" y="456.75" width="8.5" height="8.5" rx="2" fill="#19171C" stroke="#A284FF" stroke-width="1.5"/><text x="770" y="466" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" letter-spacing="-0.2" fill="#F5F3F8" text-anchor="start">Model: Info</text><text x="770" y="483" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" letter-spacing="0" fill="#A19FA4" text-anchor="start">What a model takes, for free</text></svg>