<svg xmlns="http://www.w3.org/2000/svg" width="992" height="550" viewBox="0 0 992 550" role="img" aria-label="Node map: one card for each kind of node. Image: Generate, Video: Generate, Audio: Generate, Text: Generate, and 3D: Generate each run any fal model of their kind. File: Add feeds a file input of any paid node, and Request Options feeds any paid node. Request: Download collects requests left running, and Model: Info shows what a model takes. A violet square marks a node that sends a paid request, and a hollow square one that bills nothing."><title>Node map: one card for each kind of node. Image: Generate, Video: Generate, Audio: Generate, Text: Generate, and 3D: Generate each run any fal model of their kind. File: Add feeds a file input of any paid node, and Request Options feeds any paid node. Request: Download collects requests left running, and Model: Info shows what a model takes. A violet square marks a node that sends a paid request, and a hollow square one that bills nothing.</title><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C0B1FF"/><stop offset="1" stop-color="#8553FF"/></linearGradient></defs><rect width="992" height="550" rx="20" fill="#0D0C10"/><rect x="0.5" y="0.5" width="991" height="549" rx="20" fill="none" stroke="#27262B"/><text x="32" y="46" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" letter-spacing="2.4" fill="#A284FF" text-anchor="start">NODE MAP</text><text x="32" y="82" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" letter-spacing="-0.5" fill="#F5F3F8" text-anchor="start">Nine nodes, grouped by kind</text><rect x="32" y="112" width="296" height="122" rx="14" fill="#19171C" stroke="#27262B"/><text x="52" y="142" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="normal" letter-spacing="2.2" fill="#A2