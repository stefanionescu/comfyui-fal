<svg xmlns="http://www.w3.org/2000/svg" width="992" height="550" viewBox="0 0 992 550" role="img" aria-label="Node map: one card for each kind of node. Image: Generate, Video: Generate, Audio: Generate, Text: Generate, and 3D: Generate each run any fal model of their kind. File: Add feeds a file input of any paid node, and Request Options feeds any paid node. Request: Download collects requests left running, and Model: Info shows what a model takes. A lime square marks a node that sends a paid request, and a hollow square one that bills nothing."><title>Node map: one card for each kind of node. Image: Generate, Video: Generate, Audio: Generate, Text: Generate, and 3D: Generate each run any fal model of their kind. File: Add feeds a file input of any paid node, and Request Options feeds any paid node. Request: Download collects requests left running, and Model: Info shows what a model takes. A lime square marks a node that sends a paid request, and a hollow square one that bills nothing.</title><rect width="992" height="550" rx="20" fill="#5718C0"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#99EDFF" text-anchor="start" letter-spacing="2.4">NODE MAP</text><text x="32" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.5">Nine nodes, grouped by kind</text><rect x="32" y="112" width="296" height="122" rx="14" fill="#2B0B6A"/><text x="52" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#99EDFF" text-anchor="start" letter-spacing="1.6">IMAGE</text><path d="M52 152H308" stroke="#48169C" stroke-width="1.5"/><rect x="53" y="172" width="11" height="11" rx="2" fill="#ADFF00"/><text x="74" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Generate</text><text x="7